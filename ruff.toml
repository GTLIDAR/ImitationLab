# Workspace lint exclusions. Vendored SuperMimic keeps its upstream style.

extend-exclude = [
    "third_party/supermimic",
    "third_party/mjlab_research",
    # Generated run artifacts and caches.
    "logs",
    "outputs",
    "data",
    "wandb",
    ".pixi",
    ".tmp",
    # Untracked scratch space for debugging sessions.
    "scratchpad",
]

# The vendor-derived Isaac Lab example script keeps its upstream formatting, so
# a diff against upstream shows only the real changes. Lint still covers it.
[format]
exclude = [
    "scripts/random_agent.py",
]
