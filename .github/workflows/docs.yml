name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Pixi
        env:
          PIXI_VERSION: "0.83.0"
        run: curl -fsSL https://pixi.sh/install.sh | sh
      - name: Build the site
        run: "$HOME/.pixi/bin/pixi run --locked -e docs docs-build"
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  # GitHub Pages serves the public repository only; mirrors and a private
  # repository build the site as a check and skip the deployment.
  deploy:
    if: >-
      github.event_name != 'pull_request'
      && github.repository == 'GTLIDAR/ImitationLab'
      && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
