name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Pixi
        env:
          PIXI_VERSION: "0.83.0"
        run: curl -fsSL https://pixi.sh/install.sh | sh
      - name: Check Python sources
        run: "$HOME/.pixi/bin/pixi run --locked -e static ci-static"
      - name: Check shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Pixi
        env:
          PIXI_VERSION: "0.83.0"
        run: curl -fsSL https://pixi.sh/install.sh | sh
      - name: Run CPU suites
        run: "$HOME/.pixi/bin/pixi run --locked test-default"
